# CI de code-lsp — build + contrôles de provenance.
# Vague 0 : les modules sont des squelettes vides ; le build valide la chaîne
# d'outils (JDK 21 + Kotlin), et le contrôle « anti-fichier-hors-registre »
# garantit l'exclusion définitive du moteur vendored (ADR 0001, R9.2).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build et tests (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

  banc-noyau:
    name: Banc empreinte/latence du noyau N1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      # Critère de sortie de l'étage N1 (PLAN-REECRITURE §4) : le banc produit
      # des NOMBRES à comparer entre versions — aucun seuil asserté à ce stade
      # (les seuils arrivent avec le banc de parité croisé ADR 0016, T).
      - name: Banc du noyau (:java:bench)
        run: ./gradlew :java:bench --no-daemon --stacktrace

  # Requalification des gates environnementales (RECALAGE-1 §5.1, décision
  # propriétaire : « au fil de N2 avec le SDK Android en CI »). Le jar seul
  # suffit — PAS de sdkmanager ni de licence : la plateforme est livrée en
  # zip officiel (dl.google.com, repository2-3.xml) et la variable
  # ANDROID_JAR ouvre les gates Fiche033 ×3 + Fiche004 + les tests de
  # complétion android.jar de l'étage N2 (036/043/044/050/053).
  # Fiche004 exige en plus l'AAR appcompat dans le cache Gradle (chemin que
  # le test sonde) : téléchargé depuis maven.google.com, sans build.
  # Les 2 gates `model.json` (Fiche010/Fiche039) restent dormantes : elles
  # exigent l'artefact appareil du propriétaire (jamais simulé).
  gates-android:
    name: Gates Android (SDK 34 en CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: android.jar (plateforme 34, ext12)
        run: |
          curl -sSfL --retry 3 -o p34.zip "https://dl.google.com/android/repository/platform-34-ext12_r01.zip"
          unzip -o -q p34.zip 'android-34-ext12/android.jar' -d sdk
          echo "ANDROID_JAR=$PWD/sdk/android-34-ext12/android.jar" >> "$GITHUB_ENV"
      - name: AAR appcompat (cache Gradle sondé par Fiche004)
        run: |
          mkdir -p "$HOME/.gradle/caches/modules-2/files-2.1/androidx.appcompat/appcompat/ci-gate"
          curl -sSfL --retry 3 -o "$HOME/.gradle/caches/modules-2/files-2.1/androidx.appcompat/appcompat/ci-gate/appcompat-1.7.0.aar" \
            "https://maven.google.com/androidx/appcompat/appcompat/1.7.0/appcompat-1.7.0.aar"
      - name: Tests avec gates ouvertes (:java:test)
        run: ./gradlew :java:test --no-daemon --stacktrace

  # Critère de sortie de l'étage N2 (PLAN-REECRITURE §4, ADR 0016 option 1) :
  # le banc de qualité de complétion compare recall/top-1/MRR + p95 + sauts
  # de liste à la baseline SIGNÉE (bancs/baselines/completion.json) et fait
  # ÉCHOUER la CI en cas de régression ; re-signature par PR dédiée
  # (-Presigner). Corpus jrt seul : le job tourne sans SDK.
  banc-qualite:
    name: Banc qualité complétion (baseline signée)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Banc qualité (:java:benchQualite)
        run: ./gradlew :java:benchQualite --no-daemon --stacktrace
      - name: Banc usages (:java:benchUsages)
        run: ./gradlew :java:benchUsages --no-daemon --stacktrace

  # ÉTAGE T — banc de PARITÉ CROISÉE (ADR 0016, cœur historique de T) : le
  # même corpus rejoué contre le vendored (oracle en boîte noire, exécuté
  # depuis le dépôt codeide-lsp au COMMIT ÉPINGLÉ) et le moteur neuf ;
  # baseline SIGNÉE (bancs/baselines/parite-completion.json) ; la CI ÉCHOUE
  # sur régression (couverture cahier, libellé perdu, dérive de l'oracle).
  # L'oracle est CONSTRUIT par scripts/preparer-oracle.sh (clone épinglé +
  # :lsp:java:jar du vendored, JVM pur — aucun SDK Android) ; dépôts publics
  # clonés anonymement ; .oracle/ jamais committé (R6.4). Le JDK du runner
  # porte javac (setup-java complet). Re-pin de l'oracle = PR dédiée de
  # re-signature.
  banc-parite:
    name: Banc parité croisée T (oracle vendored épinglé)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Construction de l'oracle vendored (commit épinglé cb809e14)
        run: bash scripts/preparer-oracle.sh
      - name: Banc de parité croisée (:java:benchParite)
        run: ./gradlew :java:benchParite --no-daemon --stacktrace

  provenance:
    name: Manifeste de provenance (anti-fichier-hors-registre)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Vérification du registre
        run: bash scripts/verifier-provenance.sh

  # ---------------------------------------------------------------------
  # DOMAINE KOTLIN — étage 0 clos / étage 1 engagé (ADR 0100 acceptée le
  # 2026-10-30 ; vague 1a façade `Kt*`, vague 1b session documents + SPI
  # livrées le 30/10 au soir ; vague 1c scan projet paresseux ; vague 1d
  # classpath + index appelables — reprises R4/R5, fiches 002-005/008/009/034 ;
  # vague 1e synthétiques — reprises R1/R2 ; ÉTAGE 2 vague 2a : socle de
  # résolution — fiches 017/022/006).
  # Trois gates mécaniques des critères de sortie :
  #   kotlin-parite : « suite du module verte » (fiches 010–013 (parse) +
  #                   049/042 (session documents, branchement A211) + 041
  #                   (scan paresseux) + 002–005/008/009/034 (classpath et
  #                   index appelables, vague 1d) + synthétiques R1/R2
  #                   (vague 1e) + 017/022/006 (socle de résolution,
  #                   étage 2 vague 2a : garde par déclaration, preuve
  #                   d'absence projet, journal explain) du cahier — corpus
  #                   du dépôt sans marqueur d'erreur + digeste baseline +
  #                   tolérance aux fautes + façade `Kt*` + session par le
  #                   SPI + décodeur/lecteur/index/pilote : le job lance
  #                   TOUT `:kotlin:test`, la couverture suit l'avancement
  #                   des vagues) ;
  #   kotlin-art    : « 0 motif ART » (scan du moteur ET de sa pile amont,
  #                   kotlin-metadata-jvm comprise depuis la vague 1d)
  #                   + dexage d8 réel (E-K2 : le bac à sable n'a pas d8 —
  #                   la CI le fait) + seuils (méthodes/taille vs budget T1) ;
  #   kotlin-banc   : empreinte/latence — NOMBRES seuls (miroir banc-noyau ;
  #                   les seuils arrivent avec les bancs ADR 0119) ;
  #   kotlin-banc-qualite (étage 3 vague 3e) : « qualité de complétion ≥
  #                   baseline signée, chaîne ≥ naïve +5 pts top-1/MRR,
  #                   p95 ≤ 50 ms, zéro saut de liste » — corpus versionné
  #                   completion-kotlin, miroir de :java:benchQualite (ADR
  #                   0119 option 1 / ADR 0113).
  # ---------------------------------------------------------------------
  kotlin-parite:
    name: Moteur Kotlin - suite du module (cahier COMPLET 469/469 — fiches 010-013 + 049/042/041 + 002-005/008/009/034 + synthétiques R1/R2 + 017/022/006 + 046 + 044/028/032/040/029 + 023/024/026/033/037 + 025/030/031/035/036/027 + 016/020/047 + 045 + 043 + 038/039 + 048/053/052 + 014/019/007/050 + 001/015/018/051 + 021 + cas dorés actions et protocole, étages 0-6 vagues 1a-6e + transverse T)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Suite de parité (:kotlin:test)
        run: ./gradlew :kotlin:test --no-daemon --stacktrace

  kotlin-art:
    name: Moteur Kotlin - scan ART + dexage d8 (seuils étage 0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Construction du jar moteur (:kotlin:jar)
        run: ./gradlew :kotlin:jar --no-daemon --stacktrace
      - name: "Scan ART - moteur + pile amont (gate : 0 motif)"
        run: |
          JAR_MOTEUR=$(ls kotlin/build/libs/kotlin-*.jar)
          SA=$(find "$HOME/.gradle/caches/modules-2" -name 'syntax-api-jvm-0.3.340.jar' | head -1)
          LS=$(find "$HOME/.gradle/caches/modules-2" -name 'lang-syntax-jvm-0.3.340.jar' | head -1)
          AN=$(find "$HOME/.gradle/caches/modules-2" -name 'annotations-26.0.2.jar' | head -1)
          STDLIB=$(find "$HOME/.gradle/caches/modules-2" -name 'kotlin-stdlib-2.2.10.jar' | head -1)
          KM=$(find "$HOME/.gradle/caches/modules-2" -name 'kotlin-metadata-jvm-2.2.10.jar' | head -1)
          test -n "$SA" && test -n "$LS" && test -n "$AN" && test -n "$STDLIB" && test -n "$KM"
          SORTIE=$(python3 spike-kotlin/scripts/scan-art.py "$JAR_MOTEUR" "$SA" "$LS" "$AN" "$STDLIB" "$KM")
          echo "$SORTIE"
          # Gate étage 0 : la pile SPÉCIFIQUE Kotlin (moteur + syntax-api +
          # lang-syntax + annotations + kotlin-metadata-jvm — dépendance
          # @Metadata depuis la vague 1d : son ServiceLoader est OK,
          # descripteur kotlin.metadata.internal.extensions.MetadataExtensions
          # vérifié) doit être SANS AUCUN motif sensible.
          # Règle vérifiée du scanner (vague 1b) : une référence
          # java.util.ServiceLoader AVEC descripteur META-INF/services valide
          # (chaque ligne résoluble en .class dans le jar) est tracée « OK »
          # et ne compte PAS comme motif sensible — le SPI du pack langue
          # (D6) charge le moteur par ServiceLoader, miroir de l'ancien ;
          # SANS descripteur valide, la référence RESTE un motif sensible
          # (descripteur cassé = chargement cassé au runtime).
          # Motifs MEMBRES corrélés (vague 1b) : readAllBytes/readNBytes ne
          # signale QUE java/io/InputStream (API 33+) — Files.readAllBytes
          # est Java 7 / ART 26+, légitime (le nom de membre seul est ambigu
          # dans le pool de constantes).
          # kotlin-stdlib (fondation PARTAGÉE avec :java, déjà portée par
          # l'hôte) est scannée pour mémoire : AUCUNE attendue depuis la
          # corrélation (ses 2 anciens signaux readAllBytes étaient des noms
          # Utf8 non corrélés à java/io/InputStream).
          AUCUNES=$(echo "$SORTIE" | grep -c 'références sensibles ART : AUCUNE' || true)
          if [ "$AUCUNES" -lt 5 ]; then
            echo "ÉCHEC : au moins un jar de la pile spécifique Kotlin porte des références sensibles ART (attendu : 5 × AUCUNE — moteur, syntax-api, lang-syntax, annotations, kotlin-metadata-jvm ; stdlib pour mémoire — constaté : $AUCUNES)."
            exit 1
          fi
      - name: Dexage d8 (build-tools 34) + seuils étage 0
        run: |
          curl -sSfL --retry 3 -o bt34.zip "https://dl.google.com/android/repository/build-tools_r34-linux.zip"
          unzip -o -q bt34.zip 'android-14/d8' 'android-14/lib/*' -d bt
          JAR_MOTEUR=$(ls kotlin/build/libs/kotlin-*.jar)
          SA=$(find "$HOME/.gradle/caches/modules-2" -name 'syntax-api-jvm-0.3.340.jar' | head -1)
          LS=$(find "$HOME/.gradle/caches/modules-2" -name 'lang-syntax-jvm-0.3.340.jar' | head -1)
          AN=$(find "$HOME/.gradle/caches/modules-2" -name 'annotations-26.0.2.jar' | head -1)
          STDLIB=$(find "$HOME/.gradle/caches/modules-2" -name 'kotlin-stdlib-2.2.10.jar' | head -1)
          KM=$(find "$HOME/.gradle/caches/modules-2" -name 'kotlin-metadata-jvm-2.2.10.jar' | head -1)
          test -n "$SA" && test -n "$LS" && test -n "$AN" && test -n "$STDLIB" && test -n "$KM"
          mkdir -p dex-sortie
          bt/android-14/d8 --release --min-api 26 --output dex-sortie \
            "$JAR_MOTEUR" "$SA" "$LS" "$AN" "$STDLIB" "$KM"
          ls -la dex-sortie
          python3 - <<'PY'
          import os, struct
          with open("dex-sortie/classes.dex", "rb") as f:
              entete = f.read(112)
          methodes = struct.unpack("<I", entete[88:92])[0]
          taille = os.path.getsize("dex-sortie/classes.dex")
          print(f"dex pile chaude (moteur + syntax-api + lang-syntax + annotations + kotlin-stdlib + kotlin-metadata-jvm) :")
          print(f"  références de méthodes (method_ids) : {methodes}")
          print(f"  taille classes.dex                  : {taille} octets ({taille/1024/1024:.2f} Mo)")
          assert methodes <= 32768, f"ÉCHEC seuil : {methodes} références de méthodes > 32768 (moitié du mur 64K)"
          # Budget T1 APK ÉLEVÉ par décision du propriétaire (31/10/2026,
          # alerte E-K8 : 95 % du budget 4 Mo consommés à la clôture 2c,
          # vagues 2d-2g + étages 3-6 restants) : 4 Mo → 6 Mo. Le seuil
          # méthodes reste 32 768 (moitié du mur 64K — marge structurelle,
          # jamais négociable : dépasser 65 536 casse le format dex).
          assert taille <= 6*1024*1024, f"ÉCHEC seuil : {taille} octets > 6 Mo (budget T1 APK élevé par le propriétaire le 31/10/2026 — E-K8)"
          print("OK : seuils étage 0 tenus (≤ 32 768 méthodes, ≤ 6 Mo — budget T1 élevé par le propriétaire 31/10/2026, E-K8).")
          PY

  kotlin-banc:
    name: Moteur Kotlin - banc empreinte/latence (nombres)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Banc de la grammaire (:kotlin:bench)
        run: ./gradlew :kotlin:bench --no-daemon --stacktrace

  # ÉTAGE 3 VAGUE 3e — critère de sortie de l'étage (synthèse §4 : « banc :
  # recall ≥ baseline, top-1/MRR +5 pts, p95 ≤ baseline » ; ADR 0119
  # option 1 / ADR 0113, miroir de :java:benchQualite — ADR 0016/0012) :
  # corpus versionné completion-kotlin v1 (16 positions étiquetées, stdlib
  # du runtime seule — le job tourne sans SDK), chaîne LIVRÉE vs NAÏVE
  # alphabétique (preuve de valeur : ≥ +5 points top-1/MRR exigés, sinon
  # ADR 0113 non validé), latence p95 (JVM = limite basse, borne 50 ms),
  # contrat « zéro saut de liste » (gel des têtes sur succession de
  # frappe), contrôles de santé (déterminisme des genres, stabilité sous
  # gel). Baseline SIGNÉE (bancs/baselines/completion-kotlin.json — le
  # commit qui la porte est la signature) : la tâche ÉCHOUE sur régression
  # (CI bloquante) ; re-signature par PR dédiée (-Presigner).
  kotlin-banc-qualite:
    name: Moteur Kotlin - banc qualité complétion (baseline signée, étage 3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Banc qualité (:kotlin:benchQualite)
        run: ./gradlew :kotlin:benchQualite --no-daemon --stacktrace
