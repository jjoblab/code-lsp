# CI de code-lsp — build + contrôles de provenance.
# Vague 0 : les modules sont des squelettes vides ; le build valide la chaîne
# d'outils (JDK 21 + Kotlin), et le contrôle « anti-fichier-hors-registre »
# garantit l'exclusion définitive du moteur vendored (ADR 0001, R9.2).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build et tests (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      # Vague V-A (ADR 0030) : le banc de cohérence P1–P8 passe en GATE — les
      # violations mesurées (baseline d'écart de la vague 0) sont désormais
      # des ÉCHECS bloquants à chaque push (P1/P2/P5/P6/P8 sur les scénarios
      # intégrés ; les gates corpus réel P3/P4/P7 restent conditionnées à
      # CORPUS_ANDROID — ignorées annoncées, jamais vertes silencieusement).
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
        env:
          BANC_COHERENCE_STRICT: "true"

  banc-noyau:
    name: Banc empreinte/latence du noyau N1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      # Critère de sortie de l'étage N1 (PLAN-REECRITURE §4) : le banc produit
      # des NOMBRES à comparer entre versions — aucun seuil asserté à ce stade
      # (les seuils arrivent avec le banc de parité croisé ADR 0016, T).
      - name: Banc du noyau (:java:bench)
        run: ./gradlew :java:bench --no-daemon --stacktrace

  # Requalification des gates environnementales (RECALAGE-1 §5.1, décision
  # propriétaire : « au fil de N2 avec le SDK Android en CI »). Le jar seul
  # suffit — PAS de sdkmanager ni de licence : la plateforme est livrée en
  # zip officiel (dl.google.com, repository2-3.xml) et la variable
  # ANDROID_JAR ouvre les gates Fiche033 ×3 + Fiche004 + les tests de
  # complétion android.jar de l'étage N2 (036/043/044/050/053).
  # Fiche004 exige en plus l'AAR appcompat dans le cache Gradle (chemin que
  # le test sonde) : téléchargé depuis maven.google.com, sans build.
  # Les 2 gates `model.json` (Fiche010/Fiche039) restent dormantes : elles
  # exigent l'artefact appareil du propriétaire (jamais simulé).
  gates-android:
    name: Gates Android (SDK 34 en CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: android.jar (plateforme 34, ext12)
        run: |
          curl -sSfL --retry 3 -o p34.zip "https://dl.google.com/android/repository/platform-34-ext12_r01.zip"
          unzip -o -q p34.zip 'android-34-ext12/android.jar' -d sdk
          echo "ANDROID_JAR=$PWD/sdk/android-34-ext12/android.jar" >> "$GITHUB_ENV"
      - name: AAR appcompat (cache Gradle sondé par Fiche004)
        run: |
          mkdir -p "$HOME/.gradle/caches/modules-2/files-2.1/androidx.appcompat/appcompat/ci-gate"
          curl -sSfL --retry 3 -o "$HOME/.gradle/caches/modules-2/files-2.1/androidx.appcompat/appcompat/ci-gate/appcompat-1.7.0.aar" \
            "https://maven.google.com/androidx/appcompat/appcompat/1.7.0/appcompat-1.7.0.aar"
      - name: Bibliothèques réelles du banc projet Android (INTEGRATION-CODEIDE §13)
        run: bash scripts/preparer-projet-android.sh
      - name: Tests avec gates ouvertes (:java:test)
        run: BANC_ANDROID_LIBS="$PWD/bancs/projet-android-libs" ./gradlew :java:test --no-daemon --stacktrace
        env:
          BANC_COHERENCE_STRICT: "true"

  # Critère de sortie de l'étage N2 (PLAN-REECRITURE §4, ADR 0016 option 1) :
  # le banc de qualité de complétion compare recall/top-1/MRR + p95 + sauts
  # de liste à la baseline SIGNÉE (bancs/baselines/completion.json) et fait
  # ÉCHOUER la CI en cas de régression ; re-signature par PR dédiée
  # (-Presigner). Corpus jrt seul : le job tourne sans SDK.
  banc-qualite:
    name: Banc qualité complétion (baseline signée)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Banc qualité (:java:benchQualite)
        run: ./gradlew :java:benchQualite --no-daemon --stacktrace
      - name: Banc usages (:java:benchUsages)
        run: ./gradlew :java:benchUsages --no-daemon --stacktrace

  # ÉTAGE T — banc de PARITÉ CROISÉE (ADR 0016, cœur historique de T) : le
  # même corpus rejoué contre le vendored (oracle en boîte noire, exécuté
  # depuis le dépôt codeide-lsp au COMMIT ÉPINGLÉ) et le moteur neuf ;
  # baseline SIGNÉE (bancs/baselines/parite-completion.json) ; la CI ÉCHOUE
  # sur régression (couverture cahier, libellé perdu, dérive de l'oracle).
  # L'oracle est CONSTRUIT par scripts/preparer-oracle.sh (clone épinglé +
  # :lsp:java:jar du vendored, JVM pur — aucun SDK Android) ; dépôts publics
  # clonés anonymement ; .oracle/ jamais committé (R6.4). Le JDK du runner
  # porte javac (setup-java complet). Re-pin de l'oracle = PR dédiée de
  # re-signature.
  banc-parite:
    name: Banc parité croisée T (oracle vendored épinglé)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Construction de l'oracle vendored (commit épinglé cb809e14)
        run: bash scripts/preparer-oracle.sh
      - name: Banc de parité croisée (:java:benchParite)
        run: ./gradlew :java:benchParite --no-daemon --stacktrace

  provenance:
    name: Manifeste de provenance (anti-fichier-hors-registre)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Vérification du registre
        run: bash scripts/verifier-provenance.sh
